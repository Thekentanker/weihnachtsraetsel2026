<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Weihnachtsrätsel 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", sans-serif;
    min-height:100vh;

    background:
        linear-gradient(
            rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)
        ),
        url("images/Hintergrund.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color:white;
    overflow-x:hidden;
}

.snowflake{
    position:fixed;
    top:-10px;
    color:white;
    opacity:.7;
    animation:snow linear infinite;
    pointer-events:none;
}

@keyframes flicker{

    from{
        transform:translateX(-50%) scale(1);
    }

    to{
        transform:translateX(-50%) scale(1.1);
    }
}

.header{
    text-align:center;
    padding-top:40px;
}

.header h1{
    color:#ffa500;
    text-shadow:0 0 15px rgba(255,215,0,.5);

    font-size: clamp(1.4rem, 5vw, 3rem);
    white-space: nowrap;
    overflow: hidden;
}

.advent{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:30px;
    margin-bottom:20px;
}

.candle{
    width:32px;
    height:120px;

    background:#b52a2a;

    border-radius:4px;

    position:relative;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);
}
.candle1{
    height:105px;
}

.candle2{
    height:130px;
}

.candle3{
    height:115px;
}
.candle::before{
    content:"";

    position:absolute;

    width:3px;
    height:12px;

    background:#222;

    top:-10px;
    left:50%;

    transform:translateX(-50%);
}
.flame{

    position:absolute;

    left:50%;
    top:-30px;

    width:14px;
    height:22px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse at center,
            #fffce5 0%,
            #ffd700 45%,
            #ff8a00 100%
        );

    border-radius:
        50% 50% 50% 50% /
        20% 20% 80% 80%;

    box-shadow:
        0 0 12px gold,
        0 0 25px orange;

    animation:flicker .5s ease-in-out infinite alternate;
}


.content{

    width:min(90%,650px);

    margin:20px auto;

    padding:35px;

    background:rgba(255,255,255,0.08);

    border-radius:30px;

    backdrop-filter:blur(6px);
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select{

    width:100%;
    padding:15px;

    background:#221414;
    color:white;

    border:none;
    border-radius:12px;
}

#codeSection{
    display:none;
    margin-top:30px;
}

.codeTitle{
    margin-bottom:15px;
    text-align:center;
}

.codeRow{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
}

.digit{

    width:80px;
    height:80px;

    font-size:2rem;

    text-align:center;

    border:none;
    border-radius:15px;

    background:#241818;
    color:#ffd700;
}

.digit:focus{
    outline:none;
    box-shadow:0 0 10px gold;
}

button{

    width:100%;

    padding:15px;

    border:none;
    border-radius:15px;

    background:#ffd700;

    font-size:1rem;
    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#ffea7a;

}
.buttonRow{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.buttonRow button{
    flex:1;
    margin:0;
}

#result{

    margin-top:25px;

}

.success{

    background:#123b16;

    border:2px solid #2dcc4f;

    padding:20px;

    border-radius:15px;

    animation:grow .4s;
}

.error{

    background:#4a1515;

    border:2px solid #d45656;

    padding:20px;

    border-radius:15px;
}

@keyframes grow{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.cookie{
    position:fixed;
    font-size:2rem;
    opacity:.7;
}

.cookie.left{
    left:15px;
    bottom:15px;
}

.cookie.right{
    right:15px;
    bottom:15px;
}

</style>
</head>
<body>

<div id="snow"></div>

<div class="cookie left">🍪</div>
<div class="cookie right">🍪</div>

<div class="header">

    <div class="advent">

        <div class="candle candle1">
            <div class="flame"></div>
        </div>

        <div class="candle candle2">
            <div class="flame"></div>
        </div>

        <div class="candle candle3">
            <div class="flame"></div>
        </div>

    </div>

    <h1>🎄 Weihnachtsrätsel 2026 🎄</h1>

</div>

<div class="content">

    <label>
        Um welches Rätsel handelt es sich?
    </label>

    <select id="raetsel">

        <option value="">
            --
        </option>

        <option value="1">
            Rätsel 1 - Das Rätsel beginnt
        </option>

        <option value="2">
            Rätsel 2 - Der Postversand
        </option>

        <option value="3">
            Rätsel 3 - Die Bauanleitung
        </option>
        <option value="4">
            Rätsel 4 - Die Sternenbilder
        </option>
    </select>

    <div id="codeSection">

        <h3 class="codeTitle">
            Trage hier deinen Zahlencode ein
        </h3>

        <div class="codeRow">

            <input id="d1" class="digit" maxlength="1" inputmode="numeric">
            <input id="d2" class="digit" maxlength="1" inputmode="numeric">
            <input id="d3" class="digit" maxlength="1" inputmode="numeric">
        </div>

     <div class="buttonRow">

    <button onclick="pruefen()">
        ✅ Überprüfen
    </button>

    <button onclick="zeigeHinweis()">
        💡 Hinweise
    </button>

    </div>
        
        <div id="hinweisbereich" style="display:none; margin-top:20px;">
            <div id="hinweistext"></div>
        
            <button
                id="weiterHinweis"
                onclick="naechsterHinweis()"
                style="margin-top:10px;">
                Nächster Hinweis
            </button>
        </div>

    </div>

    <div id="result"></div>

</div>

<audio id="fanfare">
    <source src="sounds/fanfare.mp3" type="audio/mpeg">
</audio>

<audio id="fail">
    <source src="sounds/fail.mp3" type="audio/mpeg">
</audio>
    
<script>

const raetsel = {

    1 : {
        code: "000",
        richtig_titel: "Krächtz, kracks, rödel, rödel. Ihr scheint eine erfolgreiche Leitung zu euren Auftraggebern aufgebaut haben. Glückwunsch!",
        richtig_text: `
            <p>"Und was nun?", fragt einer aus eurer Gruppe.</p>
            <p>
            "Ich habe da schon eine Idee, wo wir anfangen." erwiderst du. "Mein Onkel Herbert hat
            einen Fachhandel für Kerzen in Karlsruhe Grünwinkel. Er hat quasi seine
            Leidenschaft zum Beruf gemacht. Er macht das mit solch einer Hingabe,
            dass ihn mittlerweile alle nur noch Kerzbert nennen. Kommt mit. Mit dem
            Fahrrad sind wir in 15 Minuten bei ihm."
            </p>
            
            <p>
            Öffnet Umschlag Nummer 1.
            </p>
            `,
        fehler_titel: "Leider falsch",
        fehler_text: "Das ist nur ein Test. Wählt die Zahlen 0-0-0 um fortzufahren",
    
    },

    2 : {
        code: "924",
        richtig_titel: "Sehr gut! Ihr habt die richtige Versandroute entdeckt.",
        richtig_text: "Jetzt kann die Post ihr Wunder der rechtzeitigen Auslieferung vollbringen. Öffnet Umschlag Nummer 2.",
        fehler_titel: "Dieser Code ist leider falsch.",
        fehler_text: "Nicht aufgeben. Ihr findet schon die richtige Zahlenkombination.",
        hinweise: [
            "Schaut euch die Etiketten an. Könntet ihr die Post so ausliefern? Es scheinen Teile zu fehlen. Aber welche?",
            "Wie von Kerzbert erwähnt, müsst ihr die Adressen im Internet nachschlagen. Aus den Ortsnamen ergeben sich die Lösungswörter. Beachtet, wo ihr in der Geschichte seid. Dann müsst ihr den Namensteil des am weitersten entfernten Ortes als erstes eingeben.",
            "Die Orte in der richtigen Reihenfolge sind NEUNkirchen, ZWEIbrücken und VIERnheim. Die Reihenfolge ergibt sich aus dem Abstand zu Karlsruhe Grünwinkel. Daher ist die Lösung 9-2-4"
        ]
    },

    3 : {
        code: "923",
        richtig_titel: "Fantastisch. Ihr habt den Code gefunden",
        richtig_text: "Mit dem Code könnt damit die Alarmanlage ausschalten und gelangt an über einen gewundenen Weg an den Leuchtturm. Öffnet Umschlag Nummer 4.",
        fehler_titel: "Leider nicht richtig.",
        fehler_text: "Experimentiert ein wenig weiter.",
        hinweise: [
            "Die Bauanleitung schein ein Gefärt zu sein, dass euch sicher übers Wasser bringt. Das Papier muss muss entsprechend gefalten werden.",
            "Gut, ihr habt nun hoffentlich ein Schiff gemäß der Bauanleitung in euren Händen. Es wird Zeit, es zu Wasser zu lassen!",
            "Nachdem ihr das gefaltene Boot zu Wasser lasst, ergibt sich am unteren Teil des Schiffs der Zahlencode 9-2-3"
        ]
    },

    4 : {
        code: "108",
        richtig_titel: "Erfolg! Ihr habt das Sternenrätsel geknackt!",
        richtig_text: "Tatsächlich. Unterm Küchentisch kauert eine kleine Gruppe von Wichten und schaut euch verdutzt an. Einer knabbert gerade an einem Plätzchen. Ah, das erklärt also die vielen Krümel. Öffnet Umschlag 3",
        fehler_titel: "Falsch",
        fehler_text: "Stimmt nicht",
        hinweise: [
            "Waalkerz gibt euch den Hinweis, den Sternenhimmel zunächst im Hellen zu betrachten und dann im Dunklen. Dieser Hinweis scheint wichtig zu sein.",
            "Ergeben sich auf der Sternenkarte nach dem Bestrahlen durch den Leuchtturm im Dunklen Punkte? Könnt ihr daraus Zahlen ableiten?",
            "Wir geben zu: Man muss das Blatt wirklich lange und mit einer guten Lichtquelle bestrahlen. Die Lampe im Handy reichte leider nicht aus. Haltet sie am besten an einen Strahler. Danach solltet ihr im Dunklen die Zahlen 1-0-8 sehen."
        ]
    }

};
document.getElementById("raetsel")
.addEventListener("change",function(){
aktuellerHinweis = 0;

document.getElementById("hinweisbereich")
    .style.display = "none";
    document.getElementById("result").innerHTML="";
    document.getElementById("hinweistext").innerHTML = "";
    d1.value = "";
    d2.value = "";
    d3.value = "";

    if(this.value){
       const hinweisButton =
        document.querySelector('button[onclick="zeigeHinweis()"]');
        
        if(raetsel[this.value].hinweise){
            hinweisButton.style.display = "block";
        }
        else{
            hinweisButton.style.display = "none";
        } 
        document.getElementById("codeSection")
        .style.display="block";

        d1.focus();

    }
    else{

        document.getElementById("codeSection")
        .style.display="none";

    }

});

document.querySelectorAll(".digit")
.forEach((input,index,array)=>{

    input.addEventListener("input",()=>{

        input.value=input.value.replace(/\D/g,"");

        if(input.value && index<array.length-1){

            array[index+1].focus();

        }

    });

});

let aktuellerHinweis = 0;

function pruefen(){

    const r =
        document.getElementById("raetsel").value;

    const code =
        d1.value+d2.value+d3.value;

    const result =
        document.getElementById("result");

    if(code.length!==3){

        result.innerHTML=
        '<div class="error">❌ Bitte drei Ziffern eingeben.</div>';

        return;
    }

   if(code !== raetsel[r].code){

document.getElementById("fail")
    .currentTime = 0;

document.getElementById("fail")
    .play()
    .catch(() => {});

result.innerHTML =
    `
    <div class="error">
        
        <h2>${raetsel[r].fehler_titel}</h2>
    
        <p style="margin-top:15px;">
            ${raetsel[r].fehler_text}
        </p>
    </div>
    `;

    return;
}

    document.getElementById("fanfare")
    .play()
    .catch(()=>{});

    confetti();

    result.innerHTML=
    `
    <div class="success">
    
        <h2>${raetsel[r].richtig_titel}</h2>
    
        <p style="margin-top:15px;">
            ${raetsel[r].richtig_text}
        </p>
    
    </div>
    `;
}

function confetti(){

    for(let i=0;i<120;i++){

        const conf=document.createElement("div");

        const symbole = [
            "🎁",
            "⭐",
            "🍪",
            "🕯️",
            "🎄"
        ];
        conf.innerHTML =
            symbole[
                Math.floor(Math.random() * symbole.length)
            ];
        
        conf.style.position="fixed";
        conf.style.left=Math.random()*100+"vw";
        conf.style.top="-20px";
        conf.style.fontSize=20+Math.random()*20+"px";
        conf.style.pointerEvents="none";
        conf.style.zIndex="9999";

        document.body.appendChild(conf);

        const duration=
        2000+Math.random()*2000;

        conf.animate([
            {transform:"translateY(0) rotate(0deg)"},
            {transform:`translateY(110vh) rotate(${720*Math.random()}deg)`}
        ],{
            duration:duration
        });

        setTimeout(()=>conf.remove(),duration);
    }
}

function zeigeHinweis(){

    const r =
        document.getElementById("raetsel").value;

    if(!r){
        return;
    }

    aktuellerHinweis = 0;

    document.getElementById("hinweisbereich")
        .style.display = "block";

    document.getElementById("hinweistext")
        .innerHTML =
        raetsel[r].hinweise[aktuellerHinweis];

    pruefeHinweisButton();
}

function naechsterHinweis(){

    const r =
        document.getElementById("raetsel").value;

    if(
        aktuellerHinweis <
        raetsel[r].hinweise.length - 1
    ){
        aktuellerHinweis++;
    }

    document.getElementById("hinweistext")
        .innerHTML =
        raetsel[r].hinweise[aktuellerHinweis];

    pruefeHinweisButton();
}

function pruefeHinweisButton(){

    const r =
        document.getElementById("raetsel").value;

    const button =
        document.getElementById("weiterHinweis");

    if(
        aktuellerHinweis >=
        raetsel[r].hinweise.length - 1
    ){
        button.style.display = "none";
    }
    else{
        button.style.display = "block";
    }
}

function createSnow(){

    const snow =
        document.getElementById("snow");

    for(let i=0;i<50;i++){

        const flake =
            document.createElement("div");

        flake.className=
            "snowflake";

        flake.innerHTML="❄";

        flake.style.left=
            Math.random()*100+"vw";

        flake.style.fontSize=
            (10+Math.random()*20)+"px";

        flake.style.animationDuration=
            (5+Math.random()*10)+"s";

        snow.appendChild(flake);

    }
}

createSnow();

</script>

</body>
</html>
