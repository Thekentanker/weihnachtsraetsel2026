<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Weihnachtsrätsel 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", sans-serif;
    min-height:100vh;

    background:
    radial-gradient(circle at top,#5b1010 0%,#250808 40%,#0f0505 100%);

    color:white;
    overflow-x:hidden;
}

.snowflake{
    position:fixed;
    top:-10px;
    color:white;
    opacity:.7;
    animation:snow linear infinite;
    pointer-events:none;
}

@keyframes snow{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(110vh);
    }
}

.header{
    text-align:center;
    padding-top:25px;
}

.header h1{
    color:#ffd700;
    text-shadow:0 0 15px rgba(255,215,0,.5);
}

.advent{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:30px;
    margin-bottom:20px;
}

.candle{
    width:30px;
    height:120px;
    background:#a40000;
    border-radius:6px;
    position:relative;
}

.flame{
    position:absolute;
    width:18px;
    height:30px;
    left:6px;
    top:-28px;

    background:gold;
    border-radius:50% 50% 50% 50%;

    box-shadow:
        0 0 20px gold,
        0 0 40px orange;

    animation:flicker .4s infinite alternate;
}

@keyframes flicker{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.1);
    }
}

.content{

    width:min(90%,650px);

    margin:20px auto;

    padding:35px;

    background:rgba(255,255,255,0.08);

    border-radius:30px;

    backdrop-filter:blur(6px);
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}

select{

    width:100%;
    padding:15px;

    background:#221414;
    color:white;

    border:none;
    border-radius:12px;
}

#codeSection{
    display:none;
    margin-top:30px;
}

.codeTitle{
    margin-bottom:15px;
    text-align:center;
}

.codeRow{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
}

.digit{

    width:80px;
    height:80px;

    font-size:2rem;

    text-align:center;

    border:none;
    border-radius:15px;

    background:#241818;
    color:#ffd700;
}

.digit:focus{
    outline:none;
    box-shadow:0 0 10px gold;
}

button{

    width:100%;

    padding:15px;

    border:none;
    border-radius:15px;

    background:#ffd700;

    font-size:1rem;
    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#ffea7a;

}
.buttonRow{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.buttonRow button{
    flex:1;
    margin:0;
}

#result{

    margin-top:25px;

}

.success{

    background:#123b16;

    border:2px solid #2dcc4f;

    padding:20px;

    border-radius:15px;

    animation:grow .4s;
}

.error{

    background:#4a1515;

    border:2px solid #d45656;

    padding:20px;

    border-radius:15px;
}

@keyframes grow{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.cookie{
    position:fixed;
    font-size:2rem;
    opacity:.7;
}

.cookie.left{
    left:15px;
    bottom:15px;
}

.cookie.right{
    right:15px;
    bottom:15px;
}

</style>
</head>
<body>

<div id="snow"></div>

<div class="cookie left">🍪</div>
<div class="cookie right">🍪</div>

<div class="header">

    <div class="advent">

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="candle">
            <div class="flame"></div>
        </div>

    </div>

    <h1>🎄 Weihnachtsrätsel 2026 🎄</h1>

</div>

<div class="content">

    <label>
        Um welches Rätsel handelt es sich?
    </label>

    <select id="raetsel">

        <option value="">
            --
        </option>

        <option value="1">
            Rätsel 1 - Das Rätsel beginnt
        </option>

        <option value="2">
            Rätsel 2 - Der Postversand
        </option>

        <option value="3">
            Rätsel 3 - Die Bauanleitung
        </option>
        <option value="4">
            Rätsel 4 - Die Sternenbilder
        </option>
    </select>

    <div id="codeSection">

        <h3 class="codeTitle">
            Trage hier deinen Zahlencode ein
        </h3>

        <div class="codeRow">

            <input id="d1" class="digit" maxlength="1" inputmode="numeric">
            <input id="d2" class="digit" maxlength="1" inputmode="numeric">
            <input id="d3" class="digit" maxlength="1" inputmode="numeric">
        </div>

     <div class="buttonRow">

    <button onclick="pruefen()">
        ✅ Überprüfen
    </button>

    <button onclick="zeigeHinweis()">
        💡 Hinweise
    </button>

    </div>
        
        <div id="hinweisbereich" style="display:none; margin-top:20px;">
            <div id="hinweistext"></div>
        
            <button
                id="weiterHinweis"
                onclick="naechsterHinweis()"
                style="margin-top:10px;">
                Nächster Hinweis
            </button>
        </div>

    </div>

    <div id="result"></div>

</div>

<audio id="fanfare">
    <source src="sounds/fanfare.mp3" type="audio/mpeg">
</audio>

<audio id="fail">
    <source src="fail.mp3" type="audio/mpeg">
</audio>
    
<script>

const raetsel = {

    1 : {
        code: "000",
        richtig_titel: "Glückwunsch. Ihr seid bereit neue Rätsel zu bestreiten",
        richtig_text: "Nehmt euch Umschlag Nummer 2.",
        fehler_titel: "Falsch",
        fehler_text: "Stimmt nicht",
        hinweise: [
            "Hinweis 1",
            "Hinweis 2",
            "Hinweis 3"
        ]
    },

    2 : {
        code: "429",
        richtig_titel: "📮 Der Postversand",
        richtig_text: "Sehr gut! Ihr habt die richtige Versandroute entdeckt.",
        fehler_titel: "Falsch",
        fehler_text: "Stimmt nicht",
        hinweise: [
            "Hinweis 1",
            "Hinweis 2",
            "Hinweis 3"
        ]
    },

    3 : {
        code: "923",
        richtig_titel: "🛠️ Die Bauanleitung",
        richtig_titel: "Perfekt! Die Bauanleitung wurde erfolgreich entschlüsselt.",
        fehler_titel: "Falsch",
        fehler_text: "Stimmt nicht",
        hinweise: [
            "Hinweis 1",
            "Hinweis 2",
            "Hinweis 3"
        ]
    },

    4 : {
        code: "108",
        richtig_titel: "⭐ Die Sternenbilder",
        richtig_text: "Hervorragend! Die Sterne haben euch den richtigen Weg gezeigt.",
        fehler_titel: "Falsch",
        fehler_text: "Stimmt nicht",
        hinweise: [
            "Hinweis 1",
            "Hinweis 2",
            "Hinweis 3"
        ]
    }

};
document.getElementById("raetsel")
.addEventListener("change",function(){
aktuellerHinweis = 0;

document.getElementById("hinweisbereich")
    .style.display = "none";
    document.getElementById("result").innerHTML="";

    if(this.value){

        document.getElementById("codeSection")
        .style.display="block";

        d1.focus();

    }
    else{

        document.getElementById("codeSection")
        .style.display="none";

    }

});

document.querySelectorAll(".digit")
.forEach((input,index,array)=>{

    input.addEventListener("input",()=>{

        input.value=input.value.replace(/\D/g,"");

        if(input.value && index<array.length-1){

            array[index+1].focus();

        }

    });

});

let aktuellerHinweis = 0;

function pruefen(){

    const r =
        document.getElementById("raetsel").value;

    const code =
        d1.value+d2.value+d3.value;

    const result =
        document.getElementById("result");

    if(code.length!==3){

        result.innerHTML=
        '<div class="error">❌ Bitte drei Ziffern eingeben.</div>';

        return;
    }

   if(code !== raetsel[r].code){

document.getElementById("fail")
    .currentTime = 0;

document.getElementById("fail")
    .play()
    .catch(() => {});

result.innerHTML =
    `
    <div class="error">
        
        <h2>${raetsel[r].fehler_titel}</h2>
    
        <p style="margin-top:15px;">
            ${raetsel[r].fehler_text}
        </p>
    </div>
    `;

    return;
}

    document.getElementById("fanfare")
    .play()
    .catch(()=>{});

    confetti();

    result.innerHTML=
    `
    <div class="success">
    
        <h2>${raetsel[r].richtig_titel}</h2>
    
        <p style="margin-top:15px;">
            ${raetsel[r].richtig_text}
        </p>
    
    </div>
    `;
}

function confetti(){

    for(let i=0;i<120;i++){

        const conf=document.createElement("div");

        conf.innerHTML="🎉";

        conf.style.position="fixed";
        conf.style.left=Math.random()*100+"vw";
        conf.style.top="-20px";
        conf.style.fontSize=20+Math.random()*20+"px";
        conf.style.pointerEvents="none";
        conf.style.zIndex="9999";

        document.body.appendChild(conf);

        const duration=
        2000+Math.random()*2000;

        conf.animate([
            {transform:"translateY(0) rotate(0deg)"},
            {transform:`translateY(110vh) rotate(${720*Math.random()}deg)`}
        ],{
            duration:duration
        });

        setTimeout(()=>conf.remove(),duration);
    }
}

function zeigeHinweis(){

    const r =
        document.getElementById("raetsel").value;

    if(!r){
        return;
    }

    aktuellerHinweis = 0;

    document.getElementById("hinweisbereich")
        .style.display = "block";

    document.getElementById("hinweistext")
        .innerHTML =
        raetsel[r].hinweise[aktuellerHinweis];

    pruefeHinweisButton();
}

function naechsterHinweis(){

    const r =
        document.getElementById("raetsel").value;

    if(
        aktuellerHinweis <
        raetsel[r].hinweise.length - 1
    ){
        aktuellerHinweis++;
    }

    document.getElementById("hinweistext")
        .innerHTML =
        raetsel[r].hinweise[aktuellerHinweis];

    pruefeHinweisButton();
}

function pruefeHinweisButton(){

    const r =
        document.getElementById("raetsel").value;

    const button =
        document.getElementById("weiterHinweis");

    if(
        aktuellerHinweis >=
        raetsel[r].hinweise.length - 1
    ){
        button.style.display = "none";
    }
    else{
        button.style.display = "block";
    }
}

function createSnow(){

    const snow =
        document.getElementById("snow");

    for(let i=0;i<50;i++){

        const flake =
            document.createElement("div");

        flake.className=
            "snowflake";

        flake.innerHTML="❄";

        flake.style.left=
            Math.random()*100+"vw";

        flake.style.fontSize=
            (10+Math.random()*20)+"px";

        flake.style.animationDuration=
            (5+Math.random()*10)+"s";

        snow.appendChild(flake);

    }
}

createSnow();

</script>

</body>
</html>
