<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Das große Rätsel</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    background: #f4f4f4;
}

h1 {
    text-align: center;
}

.stufe {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.gesperrt {
    opacity: 0.5;
}

.karte {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 15px;
}

.kartenteil {
    border: 2px solid #999;
    background: white;
    aspect-ratio: 9.5 / 20.8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 18px;
}

.freigeschaltet {
    background: #c8f7c5;
}

input {
    padding: 8px;
    font-size: 16px;
}

button {
    padding: 8px 14px;
    cursor: pointer;
}

.erfolg {
    color: green;
}

.fehler {
    color: red;
}

</style>
</head>
<body>

<h1>🗺️ Das große Rätsel</h1>

<p>
Löst gemeinsam die Rätsel.
Jedes Rätsel liefert einen dreistelligen Zahlencode.
Mit dem richtigen Code wird die nächste Stufe freigeschaltet.
</p>

<div id="container"></div>

<script>

const raetsel = [

{
    id: 1,
    titel: "Die Karte",
    code: "582",
    typ: "karte"
},

{
    id: 2,
    titel: "Der Tresor",
    code: "314",
    typ: "standard"
},

{
    id: 3,
    titel: "Das Geheimfoto",
    code: "927",
    typ: "standard"
},

{
    id: 4,
    titel: "Finale",
    code: "000",
    typ: "standard"
}

];

function ladeSpielstand() {

    let offen = localStorage.getItem("offene_stufe");

    if (!offen) {
        offen = 1;
        localStorage.setItem("offene_stufe", 1);
    }

    return parseInt(offen);

}

function render() {

    const container =
        document.getElementById("container");

    container.innerHTML = "";

    const offeneStufe =
        ladeSpielstand();

    raetsel.forEach(stufe => {

        const div =
            document.createElement("div");

        div.className = "stufe";

        if (stufe.id > offeneStufe) {
            div.classList.add("gesperrt");
        }

        let inhalt = `
            <h2>
                ${stufe.id}. ${stufe.titel}
            </h2>
        `;

        if (stufe.id > offeneStufe) {

            inhalt += `
                <p>🔒 Noch gesperrt</p>
            `;

        } else {

            if (stufe.typ === "karte") {

                inhalt += `
                    <p>
                    Sammelt die 24 Kartenteile und
                    ermittelt den Zahlencode.
                    </p>

                    <div class="karte">
