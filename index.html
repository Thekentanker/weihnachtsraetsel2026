<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Codeprüfung</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#121212;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#1f1f1f;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
    text-align:center;
}

h1{
    margin-bottom:10px;
}

.info{
    color:#cccccc;
    margin-bottom:25px;
}

.code-container{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
}

.digit{
    width:70px;
    height:70px;
    font-size:2rem;
    text-align:center;
    border:none;
    border-radius:12px;
    background:#2b2b2b;
    color:white;
}

.digit:focus{
    outline:3px solid #4da6ff;
}

#checkValue{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:20px;
    background:#2b2b2b;
    color:white;
    font-size:1rem;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4da6ff;
    color:white;
    cursor:pointer;
    font-size:1rem;
    font-weight:bold;
}

button:hover{
    background:#348ff0;
}

#result{
    margin-top:25px;
    padding:15px;
    border-radius:12px;
    min-height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#145c22;
    color:#aef5a6;
}

.error{
    background:#641414;
    color:#ffb3b3;
}

</style>
</head>
