<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weihnachtsrätsel 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at top, #3b0000 0%, #190000 40%, #0b0b0b 100%);

    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(8px);

    border-radius:25px;

    padding:40px;

    text-align:center;

    box-shadow:
        0 0 50px rgba(0,0,0,.5),
        0 0 20px rgba(255,215,0,.15);
}

h1{
    color:#ffd700;
    margin-bottom:10px;
}

.subtitle{
    margin-bottom:30px;
    color:#d6d6d6;
}

.label{
    display:block;
    margin-bottom:12px;
    font-weight:bold;
}

select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;

    background:#1f1f1f;
    color:white;

    font-size:1rem;
}

select:focus{
    outline:none;
    box-shadow:
        0 0 0 3px #ffd700;
}

#codeBereich{
    display:none;
    margin-top:30px;
}

.code-title{
    margin-bottom:20px;
}

.code-container{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
}

.digit{
    width:80px;
    height:80px;

    border:none;
    border-radius:15px;

    background:#1f1f1f;

    color:#ffd700;

    font-size:2rem;
    font-weight:bold;
    text-align:center;
}

.digit:focus{
    outline:none;

    box-shadow:
        0 0 0 3px #ffd700,
        0 0 20px rgba(255,215,0,.5);
}

button{

    width:100%;

    padding:15px;

    border:none;
    border-radius:15px;

    font-size:1rem;
    font-weight:bold;

    cursor:pointer;

    background:#ffd700;
    color:black;

    transition:0.2s;
}

button:hover{
    transform:translateY(-2px);
}

#result{
    margin-top:25px;
}

.success-card{

    background:#123018;
    border:2px solid #32b552;

    border-radius:15px;

    padding:25px;
    color:#d8ffd8;
}

.error-card{

    background:#401515;
    border:2px solid #cf4d4d;

    border-radius:15px;

    padding:25px;

    color:#ffd2d2;
}

.success-title{
    font-size:1.6rem;
    margin-bottom:10px;
}

</style>
</head>
<body>

<div class="container">

    <h1>🎄 Weihnachtsrätsel 2026</h1>

    <div class="subtitle">
        Löse die Rätsel und überprüfe deinen Zahlencode.
    </div>

    <label class="label">
        Um welches Rätsel handelt es sich?
    </label>

    <select id="raetselAuswahl">

        <option value="">
            -- Bitte auswählen --
        </option>

        <option value="1">
            Rätsel 1 - Der Postversand
        </option>

        <option value="2">
            Rätsel 2 - Die Bauanleitung
        </option>

        <option value="3">
            Rätsel 3 - Die Sternenbilder
        </option>

    </select>

    <div id="codeBereich">

        <h3 class="code-title">
            Trage hier deinen Zahlencode ein
        </h3>

        <div class="code-container">

            <input
                id="digit1"
                class="digit"
                maxlength="1"
                inputmode="numeric">

            <input
                id="digit2"
                class="digit"
                maxlength="1"
                inputmode="numeric">

            <input
                id="digit3"
                class="digit"
                maxlength="1"
                inputmode="numeric">

        </div>

        <button onclick="pruefen()">
            Überprüfen
        </button>

    </div>

    <div id="result"></div>

</div>

<audio id="fanfare" preload="auto">
    <source src="sounds/fanfare.mp3" type="audio/mpeg">
</audio>

<script>

const raetsel = {

    "1": {
        code: "429",
        erfolg:
        "🎉 Herzlichen Glückwunsch! Rätsel 1 wurde erfolgreich gelöst."
    },

    "2": {
        code: "923",
        erfolg:
        "🎉 Herzlichen Glückwunsch! Rätsel 2 wurde erfolgreich gelöst."
    },

    "3": {
        code: "108",
        erfolg:
        "🎉 Herzlichen Glückwunsch! Rätsel 3 wurde erfolgreich gelöst."
    }

};

document
.getElementById("raetselAuswahl")
.addEventListener("change", function(){

    const bereich =
        document.getElementById("codeBereich");

    const result =
        document.getElementById("result");

    result.innerHTML = "";

    digit1.value = "";
    digit2.value = "";
    digit3.value = "";

    if(this.value){

        bereich.style.display = "block";

        setTimeout(() => {
            digit1.focus();
        },100);

    }
    else{

        bereich.style.display = "none";

    }

});

const digits =
    document.querySelectorAll(".digit");

digits.forEach((input,index,inputs)=>{

    input.addEventListener("input",()=>{

        input.value =
            input.value.replace(/\D/g,'');

        if(
            input.value &&
            index < inputs.length-1
        ){
            inputs[index+1].focus();
        }

    });

    input.addEventListener("keydown",(e)=>{

        if(
            e.key==="Backspace" &&
            input.value === "" &&
            index > 0
        ){
            inputs[index-1].focus();
        }

    });

});

function pruefen(){

    const raetselNr =
        document.getElementById("raetselAuswahl").value;

    const code =
        digit1.value +
        digit2.value +
        digit3.value;

    const result =
        document.getElementById("result");

    if(!raetselNr){

        result.innerHTML = `
            <div class="error-card">
                Bitte zuerst ein Rätsel auswählen.
            </div>
        `;

        return;
    }

    if(code.length !== 3){

        result.innerHTML = `
            <div class="error-card">
                Bitte einen vollständigen 3-stelligen Code eingeben.
            </div>
        `;

        return;
    }

    if(code !== raetsel[raetselNr].code){

        result.innerHTML = `
            <div class="error-card">
                ❌ Der Zahlencode ist leider nicht korrekt.
            </div>
        `;

        return;
    }

    const fanfare =
        document.getElementById("fanfare");

    fanfare.currentTime = 0;

    fanfare.play().catch(() => {});

    result.innerHTML = `
        <div class="success-card">

            <div class="success-title">
                🎺 🏆 Erfolg! 🏆 🎺
            </div>

            <div>
                ${raetsel[raetselNr].erfolg}
            </div>

        </div>
    `;
}

</script>

</body>
</html>
